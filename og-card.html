<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>OG image generator — Demo Contracting Ltd</title>
<style>
  body{background:#111;color:#eee;font-family:system-ui,Arial,sans-serif;text-align:center;padding:24px}
  canvas{max-width:100%;height:auto;border:1px solid #444;border-radius:8px;margin:16px 0}
  button{background:#0CA678;color:#fff;border:0;padding:12px 22px;border-radius:8px;font-size:16px;cursor:pointer}
  p{max-width:760px;margin:8px auto;line-height:1.5}
</style></head><body>
<h2>Social share image (1200×630)</h2>
<p>This makes the raster <b>og-image.png</b> for link previews on Discord, iMessage, Facebook, etc.
Click the button, then upload the downloaded file to <b>public/assets/img/og-image.png</b> and set the
<b>og_image</b> setting to <code>assets/img/og-image.png</code>.</p>
<canvas id="c" width="1200" height="630"></canvas><br>
<button id="dl">Download og-image.png</button>
<script>
var x = document.getElementById('c').getContext('2d');
x.fillStyle='#1E1E22';x.fillRect(0,0,1200,630);
x.fillStyle='#0CA678';x.fillRect(0,0,14,630);x.fillRect(0,616,1200,14);
x.fillStyle='#0CA678';x.beginPath();x.roundRect(96,96,130,130,26);x.fill();
x.fillStyle='#fff';x.beginPath();
x.moveTo(161,120);x.lineTo(205,158);x.lineTo(193,158);x.lineTo(193,205);x.lineTo(171,205);x.lineTo(171,180);x.lineTo(151,180);x.lineTo(151,205);x.lineTo(129,205);x.lineTo(129,158);x.lineTo(117,158);x.closePath();x.fill();
x.fillStyle='#ffffff';x.font="800 78px Arial, sans-serif";x.fillText('Demo Contracting Ltd',96,362);
x.fillStyle='#22c99a';x.font="700 42px Arial, sans-serif";x.fillText('Contracting & Home Improvement',100,432);
x.fillStyle='#c9d2da';x.font="400 32px Arial, sans-serif";x.fillText('Renovations · Additions · Roofing · Remodeling',100,494);
document.getElementById('dl').onclick=function(){
  var a=document.createElement('a');
  a.download='og-image.png';
  a.href=document.getElementById('c').toDataURL('image/png');
  a.click();
};
</script>
</body></html>
